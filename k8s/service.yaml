apiVersion: v1
kind: Service
metadata:
  name: mobytek-client
  namespace: mobytek
spec:
  type: NodePort
  selector:
    app: mobytek-client
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: mobytek-server
  namespace: mobytek
spec:
  type: NodePort
  selector:
    app: mobytek-server
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30081
