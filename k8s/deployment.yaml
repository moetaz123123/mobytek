apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobytek-client
  namespace: mobytek
  labels:
    app: mobytek-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mobytek-client
  template:
    metadata:
      labels:
        app: mobytek-client
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: client
          image: registry.gitlab.com/moetazbenameur3/mobytek/mobytek-client:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobytek-server
  namespace: mobytek
  labels:
    app: mobytek-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mobytek-server
  template:
    metadata:
      labels:
        app: mobytek-server
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: server
          image: registry.gitlab.com/moetazbenameur3/mobytek/mobytek-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL