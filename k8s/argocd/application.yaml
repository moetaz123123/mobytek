apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mobytek
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@gitlab.com:moetazbenameur3/mobytek.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: mobytek
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

