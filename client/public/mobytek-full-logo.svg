<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <!-- Dark vignette background matching the brand photo -->
  <defs>
    <radialGradient id="bgVignette" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#242830" />
      <stop offset="100%" stop-color="#090b0e" />
    </radialGradient>
  </defs>
  <rect width="400" height="480" rx="24" fill="url(#bgVignette)" />

  <!-- Smartphone & Cogwheel Graphic -->
  <g transform="translate(140, 50)" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Phone outline -->
    <rect x="18" y="12" width="60" height="120" rx="14" fill="none" stroke="#ffffff" stroke-width="4.5" />
    <!-- Speaker & Camera -->
    <line x1="42" y1="22" x2="56" y2="22" stroke-width="3.5" />
    <circle cx="34" cy="22" r="2" fill="#ffffff" stroke="none" />
    <!-- Screen lines -->
    <line x1="24" y1="34" x2="72" y2="34" stroke-width="2.5" opacity="0.4" />
    <line x1="24" y1="108" x2="72" y2="108" stroke-width="2.5" opacity="0.4" />
    <!-- Home button -->
    <circle cx="48" cy="120" r="4.5" stroke-width="3" fill="none" />

    <!-- Cogwheel -->
    <g transform="translate(78, 72)">
      <circle cx="0" cy="0" r="22" fill="#1b1f26" stroke="none" />
      <path
        d="
          M -4.5 -22 L 4.5 -22 L 5.5 -17.5 L 11 -15.5 L 15 -19 L 21.5 -12.5 L 18 -8.5 L 20 -3 L 24.5 -2 
          L 24.5 7 L 20 8 L 18 13.5 L 21.5 17.5 L 15 24 L 11 20.5 L 5.5 22.5 L 4.5 27 
          L -4.5 27 L -5.5 22.5 L -11 20.5 L -15 24 L -21.5 17.5 L -18 13.5 L -20 8 L -24.5 7 
          L -24.5 -2 L -20 -3 L -18 -8.5 L -21.5 -12.5 L -15 -19 L -11 -15.5 L -5.5 -17.5 Z
        "
        fill="none"
        stroke="#ffffff"
        stroke-width="4"
        stroke-linejoin="round"
      />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#ffffff" stroke-width="4" />
    </g>
  </g>

  <!-- Typography -->
  <text 
    x="200" 
    y="285" 
    text-anchor="middle" 
    fill="#ffffff" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="34" 
    font-weight="900" 
    letter-spacing="4"
  >
    MOBY TEK
  </text>
  
  <text 
    x="200" 
    y="318" 
    text-anchor="middle" 
    fill="#cbd5e1" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="13" 
    font-weight="700" 
    letter-spacing="5"
  >
    PHONES &amp; ACCESSOIRES
  </text>
</svg>
