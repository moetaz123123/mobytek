stages:
  - test
  - security

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

run_tests:
  stage: test
  image: node:22
  script:
    - npm ci
    - npm run
    - npm test --if-present
    - npm run build
  rules:
    - if: '$CI_COMMIT_BRANCH'

secret_detection:
  stage: security
  image: node:22
  script:
    - npm ci
    - npx --yes gitleaks detect --source . --no-git --redact
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH'