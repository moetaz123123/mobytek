
stages:
  - test
  - security
  - package
  - container_scan
  - reporting

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  TRIVY_NO_PROGRESS: "true"
  DEFECTDOJO_URL: "http://host.docker.internal:8080"

cache:
  key: "mobytek-npm-cache"
  paths:
    - .npm/

# 1. Build React frontend
build_frontend:
  stage: test
  tags:
    - mobytek
  image: node:22
  script:
    - npm ci --prefix client
    - npm run build --prefix client
  artifacts:
    paths:
      - client/dist/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH'

# 2. Lint frontend
lint_frontend:
  stage: test
  tags:
    - mobytek
  image: node:22
  script:
    - npm ci --prefix client
    - npm run lint --prefix client
  rules:
    - if: '$CI_COMMIT_BRANCH'

# 3. Backend syntax check
check_backend:
  stage: test
  tags:
    - mobytek
  image: node:22
  script:
    - npm ci --prefix server
    - node --check server/src/index.js
  rules:
    - if: '$CI_COMMIT_BRANCH'

# 4. SAST with Semgrep
semgrep_sast:
  stage: security
  tags:
    - mobytek
  image:
    name: semgrep/semgrep:latest
    entrypoint: [""]
  script:
    - semgrep scan --config auto --error .
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH'

# 5. Dependency vulnerability scanning
dependency_scanning:
  stage: security
  tags:
    - mobytek
  image: node:22
  script:
    - npm audit --audit-level=high --prefix client
    - npm audit --audit-level=high --prefix server
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH'

# 6. Secret detection with Gitleaks
secret_detection:
  stage: security
  tags:
    - mobytek
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-git --redact
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH'

# 7. Build and push Docker images
build_and_push_images:
  stage: package
  tags:
    - mobytek
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
  script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build --pull -f client/Dockerfile --build-arg VITE_API_URL="${VITE_API_URL:-}" -t "$CI_REGISTRY_IMAGE/mobytek-client:$CI_COMMIT_SHA" client
    - docker build --pull -f server/Dockerfile -t "$CI_REGISTRY_IMAGE/mobytek-server:$CI_COMMIT_SHA" server
    - docker push "$CI_REGISTRY_IMAGE/mobytek-client:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/mobytek-server:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH'

# 8. Scan Docker images and generate JSON reports
container_scanning:
  stage: container_scan
  tags:
    - mobytek
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"
  script:
    - mkdir -p reports
    - trivy image --format json --output reports/trivy-client.json "$CI_REGISTRY_IMAGE/mobytek-client:$CI_COMMIT_SHA"
    - trivy image --format json --output reports/trivy-server.json "$CI_REGISTRY_IMAGE/mobytek-server:$CI_COMMIT_SHA"
    - trivy image --exit-code 1 --severity HIGH,CRITICAL "$CI_REGISTRY_IMAGE/mobytek-client:$CI_COMMIT_SHA"
    - trivy image --exit-code 1 --severity HIGH,CRITICAL "$CI_REGISTRY_IMAGE/mobytek-server:$CI_COMMIT_SHA"
  artifacts:
    when: always
    paths:
      - reports/
    expire_in: 1 week
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH'

# 9. Import Trivy reports into DefectDojo
defectdojo_import:
  stage: reporting
  tags:
    - mobytek
  image:
    name: curlimages/curl:8.12.1
    entrypoint: [""]
  needs:
    - job: container_scanning
      artifacts: true
  when: always
  script:
    - test -s reports/trivy-client.json
    - test -s reports/trivy-server.json
    - |
      curl --fail-with-body --silent --show-error \
        --request POST \
        "${DEFECTDOJO_URL%/}/api/v2/import-scan/" \
        --header "Authorization: Token ${DEFECTDOJO_API_TOKEN}" \
        --form "scan_type=Trivy Scan" \
        --form "file=@reports/trivy-client.json" \
        --form "product_name=Mobytek" \
        --form "engagement_name=GitLab CI" \
        --form "auto_create_context=true"
    - |
      curl --fail-with-body --silent --show-error \
        --request POST \
        "${DEFECTDOJO_URL%/}/api/v2/import-scan/" \
        --header "Authorization: Token ${DEFECTDOJO_API_TOKEN}" \
        --form "scan_type=Trivy Scan" \
        --form "file=@reports/trivy-server.json" \
        --form "product_name=Mobytek" \
        --form "engagement_name=GitLab CI" \
        --form "auto_create_context=true"
  rules:
    - if: '$CI_COMMIT_BRANCH'
