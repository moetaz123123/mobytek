
stages:
  - install
  - test
  - security

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
      - client/package-lock.json
      - server/package-lock.json
  paths:
    - .npm/

install_dependencies:
  stage: install
  image: node:22
  script:
    - npm ci
    - npm ci --prefix client
    - npm ci --prefix server
  rules:
    - if: '$CI_COMMIT_BRANCH'

build_frontend:
  stage: test
  image: node:22
  script:
    - npm ci --prefix client
    - npm run build --prefix client
  rules:
    - if: '$CI_COMMIT_BRANCH'

lint_frontend:
  stage: test
  image: node:22
  script:
    - npm ci --prefix client
    - npm run lint --prefix client
  rules:
    - if: '$CI_COMMIT_BRANCH'

check_backend:
  stage: test
  image: node:22
  script:
    - npm ci --prefix server
    - node --check server/src/index.js
  rules:
    - if: '$CI_COMMIT_BRANCH'

secret_detection:
  stage: security
  image: zricethezav/gitleaks:latest
  script:
    - gitleaks detect --source . --no-git --redact
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH'
